name: Terraform CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    uses: devsecops-capstone-1/ci-platform/.github/workflows/terraform-ci.yml@v3
    with:
      working_directory: "."
      terraform_version: "1.14.8"
      checkov_enabled: true
