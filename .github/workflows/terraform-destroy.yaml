# terraform/.github/workflows/terraform-destroy.yaml
name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  destroy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'destroy'
    uses: devsecops-capstone-1/ci-platform/.github/workflows/terraform-destroy.yaml@v2.0.2
    with:
      working_dir: .
      tfstate_container: ${{ vars.TFSTATE_CONTAINER }}
      tfstate_key: ${{ vars.TFSTATE_KEY }}
      tfstate_storage_account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    secrets:
      azure_client_id: ${{ secrets.AZURE_TERRAFORM_DESTROY_CLIENT_ID }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
